name: CI

on:
  push:
    branches: [main, Developer]
  pull_request:
    branches: [main, Developer]
  workflow_dispatch:

# Cancela runs viejos cuando se pushea otro commit a la misma rama/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DOTNET_VERSION: '10.0.x'

jobs:
  # ─── Backend (.NET 10) ────────────────────────────────────────────────────
  backend:
    name: Backend — build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: src/backend
        run: dotnet restore SmartMenu.sln

      - name: Build (Release)
        working-directory: src/backend
        run: dotnet build SmartMenu.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=false

      - name: Test
        working-directory: tests/SmartMenu.UnitTests
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ../../test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 7

  # ─── Frontends (matrix sobre 7 apps) ──────────────────────────────────────
  frontend:
    name: Frontend — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - client-app
          - admin-panel
          - kds-app
          - waiter-app
          - host-app
          - cashier-app
          - reservation-app
    defaults:
      run:
        working-directory: src/frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/${{ matrix.app }}/package-lock.json

      - name: Install (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  # ─── E2E (Playwright) — corre solo después que frontend+backend pasen ────
